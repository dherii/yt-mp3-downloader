name: Compilar Executável Windows

on:
  push:
    branches: [ "main" ]
  tags:
    - 'v*' # Aciona a criação da página de download quando você criar uma tag (ex: v1.0.0)

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Permissão obrigatória para criar a Release

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install yt-dlp pyinstaller customtkinter

      - name: Baixar FFmpeg (Essencial para converter para MP3)
        shell: pwsh
        run: |
          # Baixa o FFmpeg oficial para Windows e extrai apenas o ffmpeg.exe
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Move-Item -Path "ffmpeg_extracted\*\bin\ffmpeg.exe" -Destination "ffmpeg.exe"

      - name: Gerar Executável (Tudo em 1 arquivo)
        shell: pwsh
        run: |
          $ctk = python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))"
          pyinstaller --noconfirm --onefile --windowed `
            --name "BaixarMusicas" `
            --add-data "${ctk};customtkinter/" `
            --add-binary "ffmpeg.exe;." `
            main.py

      - name: Publicar na Página de Releases (Apenas quando for Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BaixarMusicas.exe
          generate_release_notes: true